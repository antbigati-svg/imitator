[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imitator"
version = "3.0.0"
description = "Human-like, undetectable browser automation. Bypasses CDP/WebDriver via custom bridge and native OS inputs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"


]

dependencies = [
    "certifi>=2024.2.2",
    "websockets>=12.0",
    "pyautogui>=0.9.54",
    "HumanCursor>=1.1",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
parsing = [
    "selectolax>=0.3.17",
]
keyboard = [
    "keyboard>=0.13",
]
standalone = [
    "opencv-python>=4.8",
    "numpy>=1.24",
]
ocr = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "easyocr>=1.7",
]

[project.urls]


[tool.hatch.build.targets.wheel]
packages = ["imitator"]
include = [
    "LICENSE",
    "imitator/extension/**/*",
]
